name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default: jobs opt in to exactly what they need.
permissions: {}

# On a PR, a new push cancels the in-flight run for that branch.
# On a push to main, head_ref is empty so run_id keeps every run distinct
# and nothing gets cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Update NPM
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  # The scaffolder exists to produce a project that deploys to a Midnight
  # network, so every PR now runs one end to end: scaffold, bring up the local
  # devnet, compile, deploy (which registers NIGHT for DUST and waits for it),
  # then assert against the deployed contract. ~2 minutes, and it runs
  # alongside `test` rather than after it, so fast feedback is unaffected.
  #
  # This reuses the same job e2e.yml calls rather than restating its steps, so
  # there is one definition of "deploy to a devnet and check it" to maintain.
  devnet:
    permissions:
      contents: read
    uses: ./.github/workflows/_e2e-job.yml
    with:
      runs-on: ubuntu-latest
      scaffold-command: 'node bin/create-midnight-app.js test-app -y -t hello-world --use-npm'
      build-source: true
