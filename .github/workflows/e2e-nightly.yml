name: E2E Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        # See note in e2e.yml — macos-latest disabled until Colima works on
        # GitHub-hosted macOS runners.
        os: [ubuntu-latest]
    uses: ./.github/workflows/_e2e-job.yml
    with:
      runs-on: ${{ matrix.os }}
      scaffold-command: 'node bin/create-midnight-app.js test-app -y -t hello-world --use-npm'
      build-source: true

  preview-check:
    runs-on: ubuntu-latest
    outputs:
      has-seed: ${{ steps.check.outputs.has-seed }}
    steps:
      - id: check
        env:
          SEED: ${{ secrets.PREVIEW_TEST_WALLET_SEED }}
        run: |
          if [ -n "$SEED" ]; then
            echo "has-seed=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-seed=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-preview:
    needs: preview-check
    if: needs.preview-check.outputs.has-seed == 'true'
    uses: ./.github/workflows/_e2e-job.yml
    with:
      runs-on: ubuntu-latest
      scaffold-command: 'node bin/create-midnight-app.js test-app -y -t hello-world --use-npm'
      network: preview
    secrets:
      WALLET_SEED: ${{ secrets.PREVIEW_TEST_WALLET_SEED }}

  preprod-check:
    runs-on: ubuntu-latest
    outputs:
      has-seed: ${{ steps.check.outputs.has-seed }}
    steps:
      - id: check
        env:
          SEED: ${{ secrets.PREPROD_TEST_WALLET_SEED }}
        run: |
          if [ -n "$SEED" ]; then
            echo "has-seed=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-seed=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-preprod:
    needs: preprod-check
    if: needs.preprod-check.outputs.has-seed == 'true'
    uses: ./.github/workflows/_e2e-job.yml
    with:
      runs-on: ubuntu-latest
      scaffold-command: 'node bin/create-midnight-app.js test-app -y -t hello-world --use-npm'
      network: preprod
    secrets:
      WALLET_SEED: ${{ secrets.PREPROD_TEST_WALLET_SEED }}
