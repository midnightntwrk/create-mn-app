name: E2E (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner to use (ubuntu-latest | macos-latest)
        required: true
        type: string
      scaffold-command:
        description: Command that scaffolds a fresh project at ./test-app
        required: true
        type: string
      build-source:
        description: Whether to npm ci + npm run build the scaffolder source
        required: false
        type: boolean
        default: true
      network:
        description: Network to deploy against (undeployed | preview | preprod)
        required: false
        type: string
        default: undeployed
    secrets:
      WALLET_SEED:
        description: Pre-funded wallet seed for public-network E2E. Required when network != undeployed.
        required: false

permissions: {}

jobs:
  e2e:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Update NPM
        run: npm install -g npm@12.0.2

      - name: Install Docker via Colima (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install docker docker-compose colima
          colima start --cpu 2 --memory 4 --disk 30
          docker version

      - name: Read pinned Compact compiler version
        id: compact-version
        run: echo "version=$(cat .compact-version)" >> "$GITHUB_OUTPUT"

      # setup-compact-action only caches the CLI binary; the compiler toolchains
      # it downloads live in ~/.compact/versions, so cache those separately.
      - name: Cache Compact toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.compact
          key: compact-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.compact-version.outputs.version }}

      - name: Setup Compact compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8  # v1
        with:
          compact-version: ${{ steps.compact-version.outputs.version }}

      - name: Build scaffolder (source flavor)
        if: ${{ inputs.build-source }}
        run: |
          npm ci
          npm run build

      - name: Scaffold test-app
        run: |
          rm -rf test-app
          ${{ inputs.scaffold-command }}
          test -d test-app

      - name: npm run setup
        working-directory: test-app
        env:
          MIDNIGHT_WALLET_SEED: ${{ secrets.WALLET_SEED }}
        run: |
          if [ "${{ inputs.network }}" = "undeployed" ]; then
            npm run setup
          else
            npm run setup -- --network ${{ inputs.network }}
          fi

      - name: npm run test:e2e
        working-directory: test-app
        env:
          MIDNIGHT_WALLET_SEED: ${{ secrets.WALLET_SEED }}
        run: |
          if [ "${{ inputs.network }}" = "undeployed" ]; then
            npm run test:e2e
          else
            npm run test:e2e -- --network ${{ inputs.network }}
          fi

      - name: Capture diagnostics on failure
        if: failure()
        working-directory: test-app
        run: |
          docker compose ps -a > docker-ps.txt 2>&1 || true
          docker compose logs --no-color > docker-logs.txt 2>&1 || true

      - name: Upload diagnostics artifact on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-diagnostics-${{ inputs.runs-on }}-${{ inputs.network }}
          path: |
            test-app/docker-ps.txt
            test-app/docker-logs.txt
            test-app/.midnight-state.json
            test-app/contracts/managed/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down devnet
        if: always()
        working-directory: test-app
        run: docker compose down -v || true
