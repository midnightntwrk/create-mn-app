name: E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'templates/**'
      - 'src/**'
      - 'bin/**'
      - 'package.json'
      - 'package-lock.json'
      - '.compact-version'
      - '.github/workflows/_e2e-job.yml'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'src/**'
      - 'bin/**'
      - 'package.json'
      - 'package-lock.json'
      - '.compact-version'
      - '.github/workflows/_e2e-job.yml'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is intentionally excluded: GitHub-hosted macOS runners
        # cannot start Colima ("error at 'creating and starting': exit status 1"),
        # so the bundled devnet can't come up. Add back once we have a working
        # Docker provisioner for those runners.
        os: [ubuntu-latest]
    uses: ./.github/workflows/_e2e-job.yml
    with:
      runs-on: ${{ matrix.os }}
      scaffold-command: 'node bin/create-midnight-app.js test-app -y -t hello-world --use-npm'
      build-source: true

  preview-check:
    runs-on: ubuntu-latest
    outputs:
      has-seed: ${{ steps.check.outputs.has-seed }}
    steps:
      - id: check
        env:
          SEED: ${{ secrets.PREVIEW_TEST_WALLET_SEED }}
        run: |
          if [ -n "$SEED" ]; then
            echo "has-seed=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-seed=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-preview:
    needs: preview-check
    if: needs.preview-check.outputs.has-seed == 'true'
    uses: ./.github/workflows/_e2e-job.yml
    with:
      runs-on: ubuntu-latest
      scaffold-command: 'node bin/create-midnight-app.js test-app -y -t hello-world --use-npm'
      network: preview
    secrets:
      WALLET_SEED: ${{ secrets.PREVIEW_TEST_WALLET_SEED }}

  preprod-check:
    runs-on: ubuntu-latest
    outputs:
      has-seed: ${{ steps.check.outputs.has-seed }}
    steps:
      - id: check
        env:
          SEED: ${{ secrets.PREPROD_TEST_WALLET_SEED }}
        run: |
          if [ -n "$SEED" ]; then
            echo "has-seed=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-seed=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-preprod:
    needs: preprod-check
    if: needs.preprod-check.outputs.has-seed == 'true'
    uses: ./.github/workflows/_e2e-job.yml
    with:
      runs-on: ubuntu-latest
      scaffold-command: 'node bin/create-midnight-app.js test-app -y -t hello-world --use-npm'
      network: preprod
    secrets:
      WALLET_SEED: ${{ secrets.PREPROD_TEST_WALLET_SEED }}
